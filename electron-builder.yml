appId: com.batterytest.manager
productName: Battery Test Manager
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - node_modules/**/*
win:
  target: nsis
  icon: electron/icon.png
mac:
  target: dmg
  icon: electron/icon.png
linux:
  target: AppImage
  icon: electron/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/icon.png
  uninstallerIcon: electron/icon.png
  shortcutName: Battery Test Manager
  createDesktopShortcut: true
  createStartMenuShortcut: true
