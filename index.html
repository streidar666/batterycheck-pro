<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatteryCheck Pro 2.0 - Sistema Avanzato FNC</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel CDN (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- jsPDF, html2canvas, and Chart.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/2.2.1/chartjs-plugin-annotation.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #print-area {
            display: none;
        }

        .print-table th, .print-table td {
            border: 1px solid #ddd;
            padding: 8px;
            color: #000;
        }
        .print-table th {
            background-color: #f2f2f2;
        }

        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
            @page { size: A4; margin: 20mm; }
            body { background-color: #fff; }
        }
        
        @media (max-width: 768px) {
            .mobile-layout {
                padding-left: 0 !important;
                padding-right: 0 !important;
            }
            
            .mobile-table input {
                min-width: 70px;
                font-size: 14px;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-up {
            animation: slideUp 0.2s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 400px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- STORAGE & DATA MANAGEMENT ---
        const STORAGE_KEY = 'batterycheck_pro_data';
        const API_KEY_STORAGE = 'batterycheck_api_key';

        const loadFromStorage = () => {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                return stored ? JSON.parse(stored) : null;
            } catch {
                return null;
            }
        };

        const saveToStorage = (data) => {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                return true;
            } catch {
                return false;
            }
        };

        const loadApiKey = () => {
            try {
                return localStorage.getItem(API_KEY_STORAGE) || '';
            } catch {
                return '';
            }
        };

        const saveApiKey = (key) => {
            try {
                localStorage.setItem(API_KEY_STORAGE, key);
            } catch {
                console.warn('Unable to save API key');
            }
        };

        // --- BUSINESS LOGIC ---
        const getStatus = (cell) => {
            if (!cell.voltage && !cell.level && !cell.density) 
                return { text: "VUOTO", color: "bg-gray-400", priority: 0, isAnomaly: false, isWarning: false };

            const v = parseFloat(cell.voltage);
            const l = parseInt(cell.level);
            const d = parseFloat(cell.density);

            let status = { text: "OK", color: "bg-green-500", priority: 1, isAnomaly: false, isWarning: false };
            let reasons = [];

            // Logica di validazione FNC aggiornata - soglia critica a 1.200V
            if (!isNaN(v)) {
                if (v < 0.5) { 
                    status = { text: "ERRORE V", color: "bg-purple-500", priority: 4, isAnomaly: true, isWarning: false }; 
                    reasons.push('V'); 
                }
                else if (v <= 1.200) { 
                    status = { text: "CRITICO V", color: "bg-red-500", priority: 3, isAnomaly: true, isWarning: false }; 
                    reasons.push('V'); 
                }
                else if (v > 1.200 && v < 1.300 && status.priority < 3) { 
                    status = { text: "DA CARICARE", color: "bg-yellow-400", priority: 2, isAnomaly: false, isWarning: true }; 
                    reasons.push('V'); 
                }
                else if (v >= 1.450) { 
                    status = { text: "SOVRATENSIONE", color: "bg-red-500", priority: 3, isAnomaly: true, isWarning: false }; 
                    reasons.push('V'); 
                }
            }
            
            if (!isNaN(l)) {
                if (l < 0 || l > 6) {
                    status = { text: "ERRORE L", color: "bg-purple-500", priority: 4, isAnomaly: true, isWarning: false }; 
                    reasons.push('L');
                }
                else if (l === 0 || l === 1) { 
                    status = { text: "CRITICO L", color: "bg-red-500", priority: 3, isAnomaly: true, isWarning: false }; 
                    reasons.push('L'); 
                }
                else if (l === 2 && status.priority < 3) { 
                    status = { text: "ATTENZIONE L", color: "bg-yellow-400", priority: 2, isAnomaly: false, isWarning: true }; 
                    reasons.push('L'); 
                }
            }
            
            if (!isNaN(d)) {
                if (d < 0.5 || d > 2.0) {
                    status = { text: "ERRORE D", color: "bg-purple-500", priority: 4, isAnomaly: true, isWarning: false }; 
                    reasons.push('D');
                }
                else if (d < 1.08 || d > 1.30) { 
                    status = { text: "CRITICO D", color: "bg-red-500", priority: 3, isAnomaly: true, isWarning: false }; 
                    reasons.push('D'); 
                }
            }
            
            if (status.priority >= 3) status.text = `${status.priority === 4 ? 'ERRORE' : 'CRITICO'} ${[...new Set(reasons)].join('/')}`;
            if (status.priority === 2) status.text = `ATTENZIONE ${[...new Set(reasons)].join('/')}`;
            
            return status;
        };

        const validateVoltage = (value) => {
            if (!value) return { valid: true, message: '' };
            const num = parseFloat(value);
            if (isNaN(num)) return { valid: false, message: 'Valore non numerico' };
            if (num < 0) return { valid: false, message: 'Valore negativo non ammesso' };
            if (num > 2.0) return { valid: false, message: 'Valore troppo alto (max 2.0V)' };
            return { valid: true, message: '' };
        };

        const validateLevel = (value) => {
            if (!value) return { valid: true, message: '' };
            const num = parseInt(value);
            if (isNaN(num)) return { valid: false, message: 'Valore non numerico' };
            if (num < 0 || num > 6) return { valid: false, message: 'Range: 0-6' };
            return { valid: true, message: '' };
        };

        const validateDensity = (value) => {
            if (!value) return { valid: true, message: '' };
            const num = parseFloat(value);
            if (isNaN(num)) return { valid: false, message: 'Valore non numerico' };
            if (num < 0.5 || num > 2.0) return { valid: false, message: 'Range: 0.5-2.0 g/cm³' };
            return { valid: true, message: '' };
        };

        const formatVoltage = (val) => val ? parseFloat(val).toFixed(3) : '';
        const formatDensity = (val) => val ? parseFloat(val).toFixed(2) : '';

        // --- UTILITY COMPONENTS ---
        const Toast = ({ message, type = 'info', onClose }) => {
            const bgColor = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };

            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`toast ${bgColor[type]} text-white p-4 rounded-lg shadow-lg fade-in`}>
                    <div className="flex items-center justify-between">
                        <span>{message}</span>
                        <button onClick={onClose} className="ml-2 text-white hover:text-gray-200">×</button>
                    </div>
                </div>
            );
        };

        const ProgressRing = ({ progress, size = 120 }) => {
            const strokeWidth = 8;
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const strokeDashoffset = circumference - (progress / 100) * circumference;

            return (
                <div className="relative inline-flex items-center justify-center">
                    <svg className="progress-ring" width={size} height={size}>
                        <circle
                            className="progress-ring__circle"
                            stroke="#e5e7eb"
                            strokeWidth={strokeWidth}
                            fill="transparent"
                            r={radius}
                            cx={size / 2}
                            cy={size / 2}
                        />
                        <circle
                            className="progress-ring__circle"
                            stroke="#10b981"
                            strokeWidth={strokeWidth}
                            strokeLinecap="round"
                            fill="transparent"
                            r={radius}
                            cx={size / 2}
                            cy={size / 2}
                            style={{
                                strokeDasharray: circumference,
                                strokeDashoffset: strokeDashoffset
                            }}
                        />
                    </svg>
                    <div className="absolute text-lg font-bold text-gray-700">
                        {Math.round(progress)}%
                    </div>
                </div>
            );
        };

        // --- MAIN COMPONENTS ---
        const ConfirmationModal = ({ isOpen, onClose, onConfirm, title, children, confirmText = "Conferma", cancelText = "Annulla" }) => {
            if (!isOpen) return null;
            
            return (
                <div className="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 no-print p-4">
                    <div className="bg-white rounded-lg shadow-2xl p-6 w-full max-w-md fade-in">
                        <h3 className="text-lg font-bold text-gray-900 mb-4">{title}</h3>
                        <div className="text-sm text-gray-600 mb-6">{children}</div>
                        <div className="flex justify-end space-x-3">
                            <button 
                                onClick={onClose} 
                                className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-lg transition-colors"
                            >
                                {cancelText}
                            </button>
                            <button 
                                onClick={onConfirm} 
                                className="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
                            >
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectSetupModal = ({ onSetup, existingProjects = [] }) => {
            const [project, setProject] = useState({
                lotto: '', matricola: '', numInterno: '', data: new Date().toISOString().split('T')[0],
                numCelle: '', operatore: '', note: '', template: ''
            });
            const [error, setError] = useState('');
            const [showTemplates, setShowTemplates] = useState(existingProjects.length > 0);

            const handleChange = (e) => {
                setProject({ ...project, [e.target.name]: e.target.value });
                setError('');
            };

            const handleTemplateSelect = (templateProject) => {
                setProject({
                    ...project,
                    numCelle: templateProject.numCelle,
                    operatore: templateProject.operatore,
                    note: templateProject.note,
                    template: `Template da: ${templateProject.lotto}`
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (!project.lotto.trim()) {
                    setError('Il lotto è obbligatorio');
                    return;
                }
                if (!project.matricola.trim()) {
                    setError('La matricola è obbligatoria');
                    return;
                }
                if (!project.numCelle || parseInt(project.numCelle) <= 0) {
                    setError('Inserisci un numero di celle valido');
                    return;
                }
                if (parseInt(project.numCelle) > 200) {
                    setError('Il numero di celle non può superare 200');
                    return;
                }
                
                onSetup(project);
            };

            return (
                <div className="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg shadow-2xl p-6 w-full max-w-4xl max-h-[90vh] overflow-y-auto slide-up">
                        <div className="flex items-center mb-6">
                            <div className="bg-green-100 p-3 rounded-full mr-4">
                                <svg className="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                                </svg>
                            </div>
                            <div>
                                <h2 className="text-2xl font-bold text-gray-800">BatteryCheck Pro 2.0</h2>
                                <p className="text-gray-600">Sistema Avanzato di Controllo Batterie FNC</p>
                            </div>
                        </div>

                        {error && (
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 fade-in">
                                <strong>Errore:</strong> {error}
                            </div>
                        )}

                        {showTemplates && existingProjects.length > 0 && (
                            <div className="mb-6 p-4 bg-blue-50 rounded-lg">
                                <h3 className="font-semibold text-blue-800 mb-3">Template Disponibili</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {existingProjects.slice(-4).map((proj, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleTemplateSelect(proj)}
                                            className="text-left p-3 bg-white rounded border hover:border-blue-300 transition-colors"
                                        >
                                            <div className="font-medium">{proj.lotto}</div>
                                            <div className="text-sm text-gray-600">{proj.numCelle} celle • {proj.operatore}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <form onSubmit={handleSubmit}>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Lotto Batteria *
                                    </label>
                                    <input 
                                        name="lotto" 
                                        value={project.lotto} 
                                        onChange={handleChange}
                                        className="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
                                        placeholder="es. FNC-2024-001"
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Matricola *
                                    </label>
                                    <input 
                                        name="matricola" 
                                        value={project.matricola} 
                                        onChange={handleChange}
                                        className="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
                                        placeholder="es. BAT240001"
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Numero Interno
                                    </label>
                                    <input 
                                        name="numInterno" 
                                        value={project.numInterno} 
                                        onChange={handleChange}
                                        className="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
                                        placeholder="Codice interno opzionale"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Data Controllo
                                    </label>
                                    <input 
                                        name="data" 
                                        type="date" 
                                        value={project.data} 
                                        onChange={handleChange}
                                        className="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Numero Celle *
                                    </label>
                                    <input 
                                        name="numCelle" 
                                        type="number" 
                                        value={project.numCelle} 
                                        onChange={handleChange}
                                        className="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
                                        min="1" 
                                        max="200"
                                        placeholder="Inserisci numero celle"
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Operatore
                                    </label>
                                    <input 
                                        name="operatore" 
                                        value={project.operatore} 
                                        onChange={handleChange}
                                        className="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
                                        placeholder="Nome operatore"
                                    />
                                </div>
                            </div>
                            
                            <div className="mb-6">
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Note del Progetto
                                </label>
                                <textarea 
                                    name="note" 
                                    value={project.note} 
                                    onChange={handleChange} 
                                    rows="3"
                                    className="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
                                    placeholder="Aggiungi note o commenti sul progetto..."
                                />
                                {project.template && (
                                    <p className="text-sm text-blue-600 mt-1">{project.template}</p>
                                )}
                            </div>
                            
                            <div className="flex justify-end space-x-3">
                                <button 
                                    type="button" 
                                    onClick={() => window.location.reload()}
                                    className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-6 rounded-lg transition-colors"
                                >
                                    Annulla
                                </button>
                                <button 
                                    type="submit" 
                                    className="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-6 rounded-lg transition-colors flex items-center"
                                >
                                    <svg className="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
                                    </svg>
                                    Crea Progetto
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const MobileOptimizedTable = ({ cells, setCells, validationErrors, setValidationErrors }) => {
            const handleCellChange = (index, field, value) => {
                const newCells = [...cells];
                newCells[index][field] = value;
                setCells(newCells);
                
                // Validazione in tempo reale
                let validation = { valid: true, message: '' };
                switch(field) {
                    case 'voltage':
                        validation = validateVoltage(value);
                        break;
                    case 'level':
                        validation = validateLevel(value);
                        break;
                    case 'density':
                        validation = validateDensity(value);
                        break;
                }
                
                const newErrors = {...validationErrors};
                if (!validation.valid) {
                    newErrors[`${field}-${index}`] = validation.message;
                } else {
                    delete newErrors[`${field}-${index}`];
                }
                setValidationErrors(newErrors);
            };

            const handleKeyDown = (e, index, field) => {
                if (e.key !== 'Enter') return;
                e.preventDefault();
                
                const nextRowIndex = index + 1;
                if (nextRowIndex < cells.length) {
                    const nextInput = document.querySelector(`input[name="${field}-${nextRowIndex}"]`);
                    if (nextInput) {
                        nextInput.focus();
                        nextInput.select();
                        // Scroll automatico alla riga successiva
                        setTimeout(() => {
                            nextInput.scrollIntoView({ 
                                behavior: 'smooth', 
                                block: 'center' 
                            });
                        }, 100);
                    }
                }
            };

            const handleCellBlur = (index, field, value) => {
                let formattedValue = value;
                if (field === 'voltage') formattedValue = formatVoltage(value);
                if (field === 'density') formattedValue = formatDensity(value);
                
                if (cells[index][field] !== formattedValue) {
                   const newCells = [...cells];
                   newCells[index][field] = formattedValue;
                   setCells(newCells);
                }
            };

            return (
                <div className="bg-white rounded-lg shadow-lg overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="min-w-full divide-y divide-gray-200 mobile-table">
                            <thead className="bg-gray-50 sticky top-0 z-10">
                                <tr>
                                    <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Cella</th>
                                    <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Tensione (V)</th>
                                    <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider hidden sm:table-cell">Livello</th>
                                    <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider hidden sm:table-cell">Densità</th>
                                    <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Stato</th>
                                    <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider hidden md:table-cell">Note</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {cells.map((cell, index) => {
                                    const status = getStatus(cell);
                                    const voltageError = validationErrors[`voltage-${index}`];
                                    const levelError = validationErrors[`level-${index}`];
                                    const densityError = validationErrors[`density-${index}`];
                                    
                                    return (
                                        <tr 
                                            key={cell.id} 
                                            className={`${status.priority === 4 ? 'bg-purple-50' : status.priority === 3 ? 'bg-red-50' : status.priority === 2 ? 'bg-yellow-50' : ''} hover:bg-gray-50 transition-colors`}
                                        >
                                            <td className="px-3 py-4 whitespace-nowrap text-sm font-bold text-gray-900">
                                                {cell.id}
                                            </td>
                                            <td className="px-3 py-2
<td className="px-3 py-2">
                                                <div className="space-y-1">
                                                    <input 
                                                        type="number" 
                                                        step="0.001" 
                                                        name={`voltage-${index}`}
                                                        value={cell.voltage} 
                                                        onChange={(e) => handleCellChange(index, 'voltage', e.target.value)}

        // Analisi automatica senza API
        const buildAnalysis = (cells, stats) => {
            const cellsWithVoltage = cells.filter(c => c.voltage && !isNaN(parseFloat(c.voltage)));
            const lowVoltageCells = cellsWithVoltage.filter(c => parseFloat(c.voltage) < 1.300);
            const criticalCells = cellsWithVoltage.filter(c => parseFloat(c.voltage) <= 1.200);
            const overchargeCells = cellsWithVoltage.filter(c => parseFloat(c.voltage) >= 1.450);

            const lines = [];
            lines.push('<h4 class="font-semibold text-gray-800 mt-3 mb-1">Stato Batteria</h4>');

            if (cellsWithVoltage.length === 0) {
                lines.push('Nessun dato di tensione disponibile per l\'analisi.<br>');
            } else {
                const avgVoltage = parseFloat(stats.voltage.avg);
                if (avgVoltage >= 1.300) {
                    lines.push('<strong>BUONO</strong> - La batteria presenta una tensione media adeguata.<br>');
                } else if (avgVoltage >= 1.200) {
                    lines.push('<strong>DA CARICARE</strong> - La batteria necessita di carica per raggiungere il livello operativo.<br>');
                } else {
                    lines.push('<strong>CRITICO</strong> - La batteria presenta tensioni sotto la soglia nominale di 1.200V.<br>');
                }
            }

            lines.push('<h4 class="font-semibold text-gray-800 mt-3 mb-1">Interventi Richiesti</h4>');

            if (criticalCells.length > 0) {
                lines.push(`<strong>URGENTE:</strong> ${criticalCells.length} celle critiche (≤1.200V) - celle: ${criticalCells.map(c => c.id).join(', ')}<br>`);
            }

            if (overchargeCells.length > 0) {
                lines.push(`<strong>ATTENZIONE:</strong> ${overchargeCells.length} celle in sovratensione (≥1.450V) - celle: ${overchargeCells.map(c => c.id).join(', ')}<br>`);
            }

            if (lowVoltageCells.length > 0 && criticalCells.length === 0) {
                lines.push(`<strong>RACCOMANDATO:</strong> Caricare ${lowVoltageCells.length} celle sotto 1.300V - celle: ${lowVoltageCells.map(c => c.id).join(', ')}<br>`);
            }

            if (criticalCells.length === 0 && overchargeCells.length === 0 && lowVoltageCells.length === 0) {
                lines.push('Nessun intervento urgente richiesto. Tutte le celle operative.<br>');
            }

            lines.push('<h4 class="font-semibold text-gray-800 mt-3 mb-1">Raccomandazioni</h4>');

            if (cellsWithVoltage.length < cells.length) {
                lines.push(`Completare la misurazione delle ${cells.length - cellsWithVoltage.length} celle rimanenti.<br>`);
            }

            const voltageRange = parseFloat(stats.voltage.max) - parseFloat(stats.voltage.min);
            if (voltageRange > 0.100) {
                lines.push('Considerare equalizzazione: differenza tensioni elevata.<br>');
            }

            lines.push("Mantieni le celle sopra 1.30 V per limitare l'autoscarica.<br>");

            return lines.join('\n');
        };

        const App = () => {
            const [projectInfo, setProjectInfo] = useState(null);
            const [cells, setCells] = useState([]);
            const [validationErrors, setValidationErrors] = useState({});
            const [analysis, setAnalysis] = useState('');

            useEffect(() => {
                const savedData = loadFromStorage();
                if (savedData && savedData.projectInfo && savedData.cells) {
                    setProjectInfo(savedData.projectInfo);

                        projectInfo,
                        cells,
                        analysis,
                        timestamp: new Date().toISOString()
                    };
                    
                    if (saveToStorage(dataToSave)) {
                        const projects = JSON.parse(localStorage.getItem('batterycheck_projects') || '[]');
                        const existingIndex = projects.findIndex(p => 
                            p.lotto === projectInfo.lotto && p.matricola === projectInfo.matricola
                        );
                        
                        if (existingIndex >= 0) {
                            projects[existingIndex] = { ...projectInfo, lastModified: new Date().toISOString() };
                        } else {
                            projects.push({ ...projectInfo, lastModified: new Date().toISOString() });
                        }
                        
                        if (projects.length > 10) {
                            projects.splice(0, projects.length - 10);
                        }
                        
                        localStorage.setItem('batterycheck_projects', JSON.stringify(projects));
                    }
                }
            }, [projectInfo, cells, analysis]);

            const addToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
            };

            const removeToast = (id) => {
                setToasts(prev => prev.filter(toast => toast.id !== id));
            };

            const stats = useMemo(() => {
                if (cells.length === 0) return { 
                    completed: 0, 
                    anomalies: 0, 
                    warnings: 0, 
                    total: 0,
                    voltage: { avg: null, min: null, max: null, total: null }
                };
                
                let completed = 0, anomalies = 0, warnings = 0;
                const voltages = [];
                
                cells.forEach(cell => {
                    if (cell.voltage || cell.level || cell.density) completed++;
                    const status = getStatus(cell);
                    if (status.isAnomaly) anomalies++;
                    else if (status.isWarning) warnings++;
                    
                    if (cell.voltage) {
                        const v = parseFloat(cell.voltage);
                        if (!isNaN(v)) voltages.push(v);
                    }
                });
                
                const voltageStats = voltages.length ? {
                    min: Math.min(...voltages).toFixed(3),
                    max: Math.max(...voltages).toFixed(3),
                    avg: (voltages.reduce((a, b) => a + b, 0) / voltages.length).toFixed(3),
                    total: voltages.reduce((a, b) => a + b, 0).toFixed(3)
                } : { min: null, max: null, avg: null, total: null };
                
                return { completed, anomalies, warnings, total: cells.length, voltage: voltageStats };
            }, [cells]);

            const handleSetup = (projectData) => {
                setProjectInfo(projectData);
                setCells(Array.from({ length: parseInt(projectData.numCelle) }, (_, i) => ({
                    id: i + 1, voltage: '', level: '', density: '', notes: ''
                })));
                addToast(`Progetto "${projectData.lotto}" creato con successo!`, 'success');
            };

            const handleBulkFill = (field, value) => {
                const newCells = cells.map(cell => ({ ...cell, [field]: value }));
                setCells(newCells);
                addToast(`Compilazione di massa completata per ${field}`, 'success');
            };

            const handleClearAll = () => {
                setCells(cells.map(cell => ({ ...cell, voltage: '', level: '', density: '', notes: '' })));
                setAnalysis('');
                setValidationErrors({});
                addToast('Dati cancellati', 'warning');
            };

            const handleAnalysis = async () => {
                if (!apiKey) {
                    setAnalysis(buildAnalysis(cells, stats));
                    addToast('Analisi automatica completata', 'success');
                    return;
                }
                
                setIsAnalyzing(true);
                setAnalysis('');

                const systemPrompt = `Sei un tecnico specializzato in batterie FNC industriali.

PARAMETRI CRITICI FNC:
- Tensione nominale: 1.200V
- CARICA OTTIMALE: ≥1.300V (FONDAMENTALE!)
- Sotto 1.300V: DA CARICARE (autoscarica rapida)
- Range operativo: 1.300-1.400V
- Max sicura: 1.450V
- Sotto 1.200V: CRITICO (sotto tensione nominale)
- Sotto 1.000V: probabile cortocircuito

DIAGNOSI:
- V < 1.000V: SOSTITUIRE
- V 1.000-1.200V: carica urgente
- V 1.200-1.299V: necessita carica
- V 1.300-1.400V: OTTIMALE
- V > 1.450V: sovraccarica

Fornisci report tecnico conciso (max 80 parole) con:
### Stato Batteria
### Interventi Richiesti  
### Raccomandazioni`;
                
                const cellsWithData = cells.filter(c => c.voltage || c.level || c.density);
                const cellsToCharge = cells.filter(c => c.voltage && parseFloat(c.voltage) < 1.300).length;
                const cellsCharged = cells.filter(c => c.voltage && parseFloat(c.voltage) >= 1.300).length;

                const userQuery = `Batteria FNC: ${projectInfo.numCelle} celle totali
Celle cariche (≥1.300V): ${cellsCharged}
Celle da caricare (<1.300V): ${cellsToCharge}
Dati: ${JSON.stringify(cellsWithData.map(c => ({
    n: c.id, v: c.voltage || null, l: c.level || null, d: c.density || null
})))}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    
                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (text) {
                        const htmlAnalysis = text
                            .replace(/### (.*$)/gim, '<h4 class="font-semibold text-gray-800 mt-3 mb-1">$1</h4>')
                            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                            .replace(/\n/g, '<br />');
                        setAnalysis(htmlAnalysis);
                        addToast('Analisi AI avanzata completata', 'success');
                    }
                } catch (error) {
                    setAnalysis(buildAnalysis(cells, stats));
                    addToast('API non disponibile - utilizzata analisi automatica', 'warning');
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const handleExport = async () => {
                const { jsPDF } = window.jspdf;
                const printElement = document.getElementById('print-area');
                const fileName = `BatteryCheck_${projectInfo.lotto}_${projectInfo.matricola}_${new Date().toISOString().split('T')[0]}.pdf`;

                try {
                    addToast('Generazione PDF in corso...', 'info');
                    
                    printElement.style.display = 'block';
                    printElement.style.position = 'absolute';
                    printElement.style.left = '-9999px';

                    const canvas = await html2canvas(printElement, { 
                        scale: 2, 
                        useCORS: true,
                        windowWidth: printElement.scrollWidth,
                        windowHeight: printElement.scrollHeight
                    });
                    
                    printElement.style.display = 'none';
                    
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    const margin = 10;
                    const contentWidth = pageWidth - (margin * 2);
                    const contentHeight = pageHeight - (margin * 2);
                    
                    const canvasRatio = canvas.width / canvas.height;
                    let imgWidth = contentWidth;
                    let imgHeight = imgWidth / canvasRatio;
                    
                    if (imgHeight > contentHeight) {
                        imgHeight = contentHeight;
                        imgWidth = imgHeight * canvasRatio;
                    }
                    
                    const x = margin + (contentWidth - imgWidth) / 2;
                    const y = margin + (contentHeight - imgHeight) / 2;
                    
                    pdf.addImage(imgData, 'PNG', x, y, imgWidth, imgHeight);
                    pdf.save(fileName);
                    
                    addToast('PDF generato con successo!', 'success');
                } catch (error) {
                    printElement.style.display = 'none';
                    addToast('Errore durante la generazione del PDF', 'error');
                }
            };

            if (!projectInfo) {
                return <ProjectSetupModal onSetup={handleSetup} existingProjects={existingProjects} />;
            }

            const hasData = cells.some(cell => cell.voltage || cell.level || cell.density);

            return (
                <div className="min-h-screen bg-gray-100">
                    <header className="bg-white shadow-sm border-b border-gray-200 no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between py-4">
                                <div className="flex items-center">
                                    <div className="bg-green-100 p-2 rounded-lg mr-3">
                                        <svg className="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-bold text-gray-900">BatteryCheck Pro 2.0</h1>
                                        <p className="text-sm text-gray-600">{projectInfo.lotto} • {projectInfo.matricola}</p>
                                    </div>
                                </div>
                                <button 
                                    onClick={() => window.location.reload()}
                                    className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition-colors text-sm"
                                >
                                    Nuovo Progetto
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 mobile-layout">
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            <div className="lg:col-span-3">
                                <QuickActionsBar 
                                    onBulkFill={handleBulkFill}
                                    onClearAll={handleClearAll}
                                    onAnalysis={handleAnalysis}
                                    onExport={handleExport}
                                    isAnalyzing={isAnalyzing}
                                    hasData={hasData}
                                />
                                <MobileOptimizedTable 
                                    cells={cells}
                                    setCells={setCells}
                                    validationErrors={validationErrors}
                                    setValidationErrors={setValidationErrors}
                                />
                            </div>

                            <div className="lg:col-span-1">
                                <StatsPanel 
                                    stats={stats}
                                    analysis={analysis}
                                    isAnalyzing={isAnalyzing}
                                    apiKey={apiKey}
                                    setApiKey={setApiKey}
                                />
                            </div>
                        </div>
                    </main>

                    <div className="fixed top-4 right-4 z-50 space-y-2">
                        {toasts.map(toast => (
                            <Toast 
                                key={toast.id}
                                message={toast.message}
                                type={toast.type}
                                onClose={() => removeToast(toast.id)}
                            />
                        ))}
                    </div>

                    <div id="print-area" style={{display: 'none'}}>
                        <div className="p-8 bg-white max-w-4xl mx-auto">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Report Controllo Batteria FNC</h1>
                                <p className="text-lg text-gray-600">BatteryCheck Pro 2.0 - Sistema Avanzato</p>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-8 mb-8 pb-6 border-b-2 border-gray-200">
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-4">Informazioni Progetto</h2>
                                    <div className="space-y-2">
                                        <p><span className="font-semibold">Lotto:</span> {projectInfo.lotto}</p>
                                        <p><span className="font-semibold">Matricola:</span> {projectInfo.matricola}</p>
                                        <p><span className="font-semibold">Numero Interno:</span> {projectInfo.numInterno || 'N/A'}</p>
                                        <p><span className="font-semibold">Data Controllo:</span> {projectInfo.data}</p>
                                    </div>
                                </div>
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-4">Informazioni Operative</h2>
                                    <div className="space-y-2">
                                        <p><span className="font-semibold">Operatore:</span> {projectInfo.operatore || 'N/A'}</p>
                                        <p><span className="font-semibold">Celle Totali:</span> {projectInfo.numCelle}</p>
                                        <p><span className="font-semibold">Report Generato:</span> {new Date().toLocaleString('it-IT')}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-4 gap-4 mb-8 text-center">
                                <div className="p-4 border-2 border-green-200 rounded-lg bg-green-50">
                                    <h3 className="text-2xl font-bold text-green-600">{stats.voltage.avg || 'N/A'} V</h3>
                                    <p className="text-sm text-green-800">Tensione Media</p>
                                </div>
                                <div className="p-4 border-2 border-blue-200 rounded-lg bg-blue-50">
                                    <h3 className="text-2xl font-bold text-blue-600">{stats.completed}</h3>
                                    <p className="text-sm text-blue-800">Celle Completate</p>
                                </div>
                                <div className="p-4 border-2 border-red-200 rounded-lg bg-red-50">
                                    <h3 className="text-2xl font-bold text-red-600">{stats.anomalies}</h3>
                                    <p className="text-sm text-red-800">Anomalie Critiche</p>
                                </div>
                                <div className="p-4 border-2 border-yellow-200 rounded-lg bg-yellow-50">
                                    <h3 className="text-2xl font-bold text-yellow-600">{stats.warnings}</h3>
                                    <p className="text-sm text-yellow-800">Attenzioni</p>
                                </div>
                            </div>

                            {analysis && (
                                <div className="mb-8">
                                    <h2 className="text-xl font-bold text-gray-800 mb-4 text-center">Analisi Tecnica e Raccomandazioni</h2>
                                    <div className="p-6 border-2 border-yellow-200 rounded-lg bg-yellow-50" dangerouslySetInnerHTML={{ __html: analysis }}></div>
                                </div>
                            )}
                            
                            {cells.some(cell => cell.voltage) && (
                                <div className="mb-8">
                                    <h2 className="text-xl font-bold text-gray-800 mb-4 text-center">Andamento Tensioni per Cella</h2>
                                    <div className="w-full bg-white p-4 border-2 border-gray-200 rounded-lg">
                                        <div className="w-full mx-auto" style={{height: '300px'}}>
                                            <ReportChart cells={cells} />
                                        </div>
                                        <div className="mt-4 grid grid-cols-4 gap-2 text-xs text-center">
                                            <div className="flex items-center justify-center">
                                                <div className="w-4 h-2 bg-red-200 border border-red-400 mr-2"></div>
                                                <span>Critico (≤1.200V)</span>
                                            </div>
                                            <div className="flex items-center justify-center">
                                                <div className="w-4 h-2 bg-yellow-200 border border-yellow-400 mr-2"></div>
                                                <span>Da caricare (&lt;1.300V)</span>
                                            </div>
                                            <div className="flex items-center justify-center">
                                                <div className="w-4 h-2 bg-green-200 border border-green-400 mr-2"></div>
                                                <span>Ottimale (1.300-1.449V)</span>
                                            </div>
                                            <div className="flex items-center justify-center">
                                                <div className="w-4 h-2 bg-red-200 border border-red-400 mr-2"></div>
                                                <span>Sovratensione (≥1.450V)</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                            
                            <div className="mb-8">
                                <h2 className="text-xl font-bold text-gray-800 mb-4 text-center">Dettaglio Controlli per Cella</h2>
                                <table className="w-full border-collapse border-2 border-gray-300">
                                    <thead>
                                        <tr className="bg-gray-200">
                                            <th className="border border-gray-300 px-4 py-2 text-left font-bold">Cella</th>
                                            <th className="border border-gray-300 px-4 py-2 text-left font-bold">Tensione (V)</th>
                                            <th className="border border-gray-300 px-4 py-2 text-left font-bold">Livello</th>
                                            <th className="border border-gray-300 px-4 py-2 text-left font-bold">Densità</th>
                                            <th className="border border-gray-300 px-4 py-2 text-left font-bold">Stato</th>
                                            <th className="border border-gray-300 px-4 py-2 text-left font-bold">Note</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {cells.map(cell => {
                                            const status = getStatus(cell);
                                            return (
                                                <tr key={`print-${cell.id}`} className={status.priority >= 3 ? 'bg-red-50' : status.priority === 2 ? 'bg-yellow-50' : ''}>
                                                    <td className="border border-gray-300 px-4 py-2 font-medium">{cell.id}</td>
                                                    <td className="border border-gray-300 px-4 py-2">{cell.voltage || '-'}</td>
                                                    <td className="border border-gray-300 px-4 py-2">{cell.level || '-'}</td>
                                                    <td className="border border-gray-300 px-4 py-2">{cell.density || '-'}</td>
                                                    <td className="border border-gray-300 px-4 py-2 font-semibold">{status.text}</td>
                                                    <td className="border border-gray-300 px-4 py-2">{cell.notes || '-'}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>

                            <div className="grid grid-cols-2 gap-8 mb-8">
                                <div>
                                    <h3 className="text-lg font-bold text-gray-800 mb-3">Note Generali del Progetto</h3>
                                    <div className="p-4 border-2 border-gray-200 rounded-lg bg-gray-50 min-h-[100px]">
                                        {projectInfo.note || 'Nessuna nota specificata per questo progetto.'}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-lg font-bold text-gray-800 mb-3">Legenda Stati</h3>
                                    <div className="space-y-2 text-sm">
                                        <div className="flex items-center"><div className="w-4 h-4 bg-green-500 rounded-full mr-3"></div><span>OK - Parametri nella norma</span></div>
                                        <div className="flex items-center"><div className="w-4 h-4 bg-yellow-400 rounded-full mr-3"></div><span>ATTENZIONE - Controllo raccomandato</span></div>
                                        <div className="flex items-center"><div className="w-4 h-4 bg-red-500 rounded-full mr-3"></div><span>CRITICO - Intervento urgente</span></div>
                                        <div className="flex items-center"><div className="w-4 h-4 bg-purple-500 rounded-full mr-3"></div><span>ERRORE - Valore non valido</span></div>
                                        <div className="flex items-center"><div className="w-4 h-4 bg-gray-400 rounded-full mr-3"></div><span>VUOTO - Nessun dato inserito</span></div>
                                    </div>
                                </div>
                            </div>

                            <div className="text-center text-sm text-gray-600 border-t-2 border-gray-200 pt-4">
                                <p>Questo report è stato generato automaticamente da BatteryCheck Pro 2.0</p>
                                <p>Sistema Avanzato di Controllo e Diagnostica per Batterie FNC</p>
                                <p className="mt-2 font-medium">Parametri di riferimento FNC: Tensione nominale 1.200V • Ottimale ≥1.300V • Max sicurezza 1.450V</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
